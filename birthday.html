<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday ??</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      height:100vh;
      overflow:hidden;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4,#fbc2eb);
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:20px;
      position:relative;
    }

    .card{
      background:rgba(255,255,255,0.2);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.3);
      border-radius:25px;
      padding:40px 25px;
      max-width:450px;
      width:100%;
      color:white;
      box-shadow:0 8px 32px rgba(0,0,0,0.2);
      animation:fadeIn 1.5s ease;
    }

    h1{
      font-size:2.5rem;
      margin-bottom:10px;
      animation:bounce 2s infinite;
    }

    h2{
      font-size:1.5rem;
      font-weight:600;
      margin-bottom:20px;
    }

    p{
      font-size:1rem;
      line-height:1.7;
      margin-bottom:25px;
    }

    .btn{
      background:white;
      color:#ff4f81;
      border:none;
      padding:14px 28px;
      border-radius:50px;
      font-size:1rem;
      font-weight:600;
      cursor:pointer;
      transition:0.3s ease;
    }

    .btn:hover{
      transform:scale(1.08);
      background:#ffe3ec;
    }

    .cake{
      font-size:4rem;
      margin-bottom:15px;
      animation:float 3s ease-in-out infinite;
    }

    @keyframes fadeIn{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes bounce{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-8px);
      }
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-10px);
      }
    }

    /* Mobile Friendly */
    @media(max-width:600px){
      h1{
        font-size:2rem;
      }

      h2{
        font-size:1.2rem;
      }

      p{
        font-size:0.95rem;
      }

      .card{
        padding:30px 20px;
      }

      .cake{
        font-size:3.2rem;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="cake">??</div>

    <h1>Happy Birthday!</h1>

    <h2>Dear Best Friend ??</h2>

    <p>
      Wishing you endless happiness, love, success, and unforgettable memories.
      May your special day be filled with laughter, cake, surprises, and all the things you love most!
    </p>

    <button class="btn" onclick="startCelebration()">
      Celebrate ??
    </button>
  </div>

  <script>
    // Auto Confetti on Load
    window.onload = () => {
      launchConfetti();
    };

    function launchConfetti() {
      confetti({
        particleCount: 180,
        spread: 100,
        origin: { y: 0.6 }
      });
    }

    function startCelebration() {

      // Multiple bursts
      const duration = 3000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 8,
          angle: 60,
          spread: 70,
          origin: { x: 0 }
        });

        confetti({
          particleCount: 8,
          angle: 120,
          spread: 70,
          origin: { x: 1 }
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }
  </script>

</body>
</html>
